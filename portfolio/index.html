<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Hennessey Design</title>
	<meta name="description" content="Portfolio of Patrick Hennessey — production design and automation systems for global brands including Apple, adidas, Under Armour, and Electronic Arts." />
	<link rel="preconnect" href="https://use.typekit.net" crossorigin />
	<link rel="stylesheet" href="https://use.typekit.net/cho8xtx.css" />
	<link rel="stylesheet" href="styles.css" />
</head>
<body>

	<div class="stage" id="stage">

		<!-- The bookend slides are one-off content, so they are authored here.
		     The 14 content slides in between are generated by ui.js from the
		     #content-slide template below, and inserted before #slide-outro so
		     DOM order stays in index order. -->

		<div class="frame" id="frame">

			<div class="slide slide--accent" id="slide-cover">
				<div class="cover-content">
					<h1 class="wordmark"><span class="wm-first">Patrick</span><span class="wm-last">Hennessey</span></h1>
					<p class="wm-sub">Production Design &amp;<br />Automation Systems</p>
				</div>
			</div>

			<!-- Starts inert so the resume link isn't tabbable before ui.js runs;
			     ui.js takes over the attribute from there. -->
			<div class="slide slide--accent" id="slide-outro" inert>
				<div class="cover-content">
					<p class="wordmark"><span class="wm-first">Patrick</span><span class="wm-last">Hennessey</span></p>
					<p class="wm-sub">p.hennessey@yahoo.com</p>
					<p class="wm-sub wm-resume">
						<a href="img/PatrickHennessey_Resume_2026.pdf" target="_blank" rel="noopener">View resume <span class="wm-resume-arrow">&#9654;</span></a>
					</p>
				</div>
			</div>

		</div>

		<button class="nav-arrow nav-prev is-hidden" id="prev" aria-label="Previous slide">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
		</button>

		<button class="nav-arrow nav-next" id="next" aria-label="Next slide">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
		</button>

	</div>

	<!-- Structure of one content slide. ui.js clones this per entry in SLIDES
	     and fills each [data-field] from that entry, so no markup is built in
	     JavaScript. The <img> is left without a src on purpose — ui.js assigns
	     it lazily so the initial load doesn't pull all 14 full-size JPGs. -->
	<template id="content-slide">
		<div class="slide">
			<div class="slide-bar">
				<div class="bar-top">
					<div class="slide-name">Patrick Hennessey</div>
					<h2 class="slide-title"><span>Production</span><span>Design</span></h2>
				</div>
				<div class="bar-bottom">
					<div class="cat">
						<div class="cat-h">Agency</div>
						<div class="cat-b" data-field="agency"></div>
					</div>
					<div class="cat">
						<div class="cat-h">Client</div>
						<div class="cat-b" data-field="client"></div>
					</div>
					<div class="cat">
						<div class="cat-h">Project</div>
						<div class="cat-b" data-field="project"></div>
					</div>
					<div class="cat">
						<div class="cat-h">Roles</div>
						<div class="cat-b" data-field="roles"></div>
					</div>
				</div>
			</div>
			<img class="slide-image" alt="" decoding="async" />
		</div>
	</template>

	<script src="ui.js"></script>
</body>
</html>
