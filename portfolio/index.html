<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Hennessey Design</title>
	<link rel="stylesheet" href="https://use.typekit.net/cho8xtx.css">
	<link rel="stylesheet" href="styles.css" />
</head>
<body>

	<div class="stage" id="stage">

		<div class="frame" id="frame">
			<!-- slides injected by ui.js -->
		</div>

		<button class="nav-arrow nav-prev is-hidden" id="prev" aria-label="Previous slide">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
		</button>

		<button class="nav-arrow nav-next" id="next" aria-label="Next slide">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
		</button>

	</div>

	<script src="ui.js"></script>
</body>
</html>
