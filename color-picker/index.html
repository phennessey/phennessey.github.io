<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OKHSL Color Picker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="top-ui">
    <!-- Add swatch: bottom-right corner of the top UI frame (user decision
         2026-10-21). First child so the frame's last-section rules still see
         the State section as last; it's absolutely positioned. -->
    <button id="add-color-btn" type="button" aria-label="Add color" title="Add swatch"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10"/></svg></button>

    <div class="picker-wrap color-map-panel">
      <!-- P3 gamut switch: on = P3 mode, off = sRGB mode (see src/mode.js). -->
      <button type="button" class="gamut-toggle" id="gamut-toggle" role="switch" aria-checked="true">
        <span class="gamut-toggle-track" aria-hidden="true"><span class="gamut-toggle-knob"></span></span>
        <span class="gamut-toggle-label">P3</span>
      </button>
      <div class="colormap-body">
        <div class="panel">
          <canvas id="wheel"></canvas>
          <svg class="overlay" id="disc-overlay"></svg>
        </div>
        <div class="panel">
          <div id="lightbar"></div>
          <svg class="overlay" id="lightbar-overlay"></svg>
        </div>
      </div>
    </div>

    <!-- CMYK over Libraries (order swapped 2026-10-22), each switched on and
         off by the switch in its header; never collapsible (user decisions
         2026-10-21). The old empty Export section is gone. -->
    <div class="ui-column">
      <div class="ui-section section-cmyk checkable">
        <div class="section-head">
          <label class="section-check"><input type="checkbox" class="section-toggle" id="toggle-cmyk"><span class="section-label">CMYK</span></label>
        </div>
        <div class="section-body cmyk-body">
          <div class="cmyk-controls">
            <div class="cmyk-profile-row">
              <label class="cmyk-profile-label" for="cmyk-profile">ICC profile</label>
              <div class="cmyk-profile-select-wrap">
                <select class="cmyk-profile-select" id="cmyk-profile">
                  <option value="gracol">GRACoL 2006</option>
                  <option value="swop">U.S. SWOP v2</option>
                  <option value="fogra39">FOGRA39</option>
                </select>
              </div>
            </div>
          </div>
          <label class="cmyk-check">
            <input type="checkbox" id="cmyk-show-boundary" checked>
            <span>Show gamut boundary</span>
          </label>
          <label class="cmyk-check">
            <input type="checkbox" id="cmyk-allow-adjust" checked>
            <span>Allow adjustments</span>
          </label>
        </div>
      </div>

      <div class="ui-section section-libraries checkable">
        <div class="section-head">
          <label class="section-check"><input type="checkbox" class="section-toggle" id="toggle-libraries"><span class="section-label">Libraries</span></label>
        </div>
        <div class="section-body library-panel" id="library-panel">
          <div class="lib-list" id="lib-list"></div>
          <div class="lib-import-row">
            <button type="button" class="lib-add" id="lib-add" title="Add libraries">ADD</button>
            <input type="file" id="lib-file" multiple hidden>
            <div class="lib-files">Compatible files: .ase, .acb, .aco,<br>.gpl, .csv, .json</div>
          </div>
          <div class="pantone-options">
            <label><input type="checkbox" id="toggle-hide-on-promote" checked> Hide matches after promotion</label>
          </div>
        </div>
      </div>
    </div>

    <!-- State: no label and no divider before it (user decision 2026-10-22) —
         the box sits up where the label row was. -->
    <div class="ui-section section-setup">
      <div class="section-body hex-panel">
        <textarea class="hex-input" spellcheck="false" autocomplete="off" aria-label="Swatch state, one swatch per line"></textarea>
      </div>
    </div>
  </div>
  <div class="swatches"></div>
  <div class="status-region" id="status-region"></div>

  <!-- Vendored Little-CMS-class ICC engine (UMD global `jsColorEngine`), loaded
       before the module so the CMYK feature can use it synchronously. -->
  <script src="./lib/jsColorEngineWeb.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
