<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OKHSL Color Picker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="top-ui">

    <div class="picker-wrap color-map-panel">
      <!-- P3 gamut switch: on = P3 mode, off = sRGB mode (see src/mode.js). -->
      <button type="button" class="gamut-toggle" id="gamut-toggle" role="switch" aria-checked="true">
        <span class="gamut-toggle-track" aria-hidden="true"><span class="gamut-toggle-knob"></span></span>
        <span class="gamut-toggle-label">P3</span>
      </button>
      <div class="colormap-body">
        <div class="panel">
          <canvas id="wheel"></canvas>
          <svg class="overlay" id="disc-overlay"></svg>
        </div>
        <div class="panel">
          <div id="lightbar"></div>
          <svg class="overlay" id="lightbar-overlay"></svg>
        </div>
      </div>
    </div>

    <div class="ui-section section-setup">
      <div class="section-head">
        <div class="section-label">Setup</div>
      </div>
      <div class="section-body hex-panel">
        <textarea class="hex-input" spellcheck="false" autocomplete="off"></textarea>
        <button id="add-color-btn" type="button" aria-label="Add color">+</button>
      </div>
    </div>

    <div class="section-divider"></div>

    <div class="ui-section section-libraries collapsible">
      <div class="section-head">
        <span class="section-toggle-box">
          <input type="checkbox" class="section-toggle" id="toggle-libraries">
          <span class="section-tri" aria-hidden="true"></span>
        </span>
        <label class="section-label" for="toggle-libraries">Libraries</label>
      </div>
      <div class="section-vlabel">Libraries</div>
      <div class="section-body library-panel" id="library-panel">
        <div class="lib-list" id="lib-list"></div>
        <div class="lib-empty" id="lib-empty">No libraries yet. Import .ase, .acb,<br>.aco, .gpl, .csv or .json files.</div>
        <div class="lib-actions">
          <button type="button" class="lib-add" id="lib-add" aria-label="Import libraries" title="Import libraries">+</button>
          <input type="file" id="lib-file" multiple hidden>
          <button type="button" class="lib-export" id="lib-export">Export all libraries</button>
        </div>
        <div class="pantone-options">
          <label><input type="checkbox" id="toggle-metallic-texture"> Simulate texture<br>for metallic inks</label>
          <label><input type="checkbox" id="toggle-hide-on-promote" checked> Hide matches<br>after promotion</label>
        </div>
      </div>
    </div>

    <div class="section-divider"></div>

    <div class="ui-section section-cmyk collapsible">
      <div class="section-head">
        <span class="section-toggle-box">
          <input type="checkbox" class="section-toggle" id="toggle-cmyk">
          <span class="section-tri" aria-hidden="true"></span>
        </span>
        <label class="section-label" for="toggle-cmyk">CMYK</label>
      </div>
      <div class="section-vlabel">CMYK</div>
      <div class="section-body cmyk-body">
        <div class="cmyk-controls">
          <div class="cmyk-profile-row">
            <label class="cmyk-profile-label" for="cmyk-profile">ICC profile</label>
            <div class="cmyk-profile-select-wrap">
              <select class="cmyk-profile-select" id="cmyk-profile">
                <option value="gracol">GRACoL 2006</option>
                <option value="swop">U.S. SWOP v2</option>
                <option value="fogra39">FOGRA39</option>
              </select>
            </div>
          </div>
        </div>
        <label class="cmyk-check">
          <input type="checkbox" id="cmyk-show-boundary" checked>
          <span>Show gamut boundary</span>
        </label>
      </div>
    </div>

    <div class="section-divider"></div>

    <div class="ui-section section-export collapsible">
      <div class="section-head">
        <span class="section-toggle-box">
          <input type="checkbox" class="section-toggle" id="toggle-export">
          <span class="section-tri" aria-hidden="true"></span>
        </span>
        <label class="section-label" for="toggle-export">Export</label>
      </div>
      <div class="section-vlabel">Export</div>
      <div class="section-body export-body"></div>
    </div>
  </div>
  <div class="swatches"></div>
  <div class="status-region" id="status-region"></div>

  <!-- Vendored Little-CMS-class ICC engine (UMD global `jsColorEngine`), loaded
       before the module so the CMYK feature can use it synchronously. -->
  <script src="./lib/jsColorEngineWeb.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
